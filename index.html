<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS2 FREE GAMES</title>
    <link rel="icon" type= "image/png" href="fotos/ps2.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#" class="boton-ingresar" id="btn-ingresar">Ingresar a la Pagina</a>

    <div class="modal-container" id="login-modal">
        <div class="modal-content">
            <span class="close-btn" id="btn-cerrar">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" placeholder="IngresarUsuario" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
                <p id="mensaje-error" class="mensaje-error"></p>
            </form>
        </div>
    </div>

    
    <script src="js/inde.js"></script>
</body>
</html>
